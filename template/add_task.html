{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    <link rel="stylesheet" href="{% static 'add_task.css' %}">
</head>
<body>
    <div class="add_task_bar">
        {% include 'navbar.html' %}
        <div class="add_task_box">
            <h1>Add Task</h1>
            <form method="POST" action="{% url 'add_task' %}">
                {% csrf_token %}
                <label for="title">Title:</label><br>
                <input type="text" id="title" name="title" maxlength="100" required><br><br>
                <label for="description">Description:</label><br>
                <textarea id="description" name="description" maxlength="1000" required></textarea><br>
                <div class="btn_box">
                    <button class="save">Save</button>
                    <a href="{% url 'home' %}" class="cancel">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
