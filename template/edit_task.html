{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{% static 'navbar.css' %}">
    <link rel="stylesheet" href="{% static 'edit_task.css' %}">
</head>
<body>
    <div class="edit_task_bar">

        {% include 'navbar.html' %}

        <div class="edit_task_box">
            <h1>Edit Task</h1>

            <form action="{% url 'edit_task' task.id %}" method="POST">
                {% csrf_token %}

                <label for="title">Title:</label>
                <input type="text" id="title" name="title"
                       value="{{ task.title }}" maxlength="100" required>

                <label for="description">Description:</label>
                <textarea id="description" name="description" maxlength="1000" required>{{ task.description }}</textarea>

                <div class="btn_box">
                    <button type="submit" class="save">Save</button>
                    <a href="{% url 'home' %}" class="cancel">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
